<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>모둠별 교류 제안서 예시</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Gowun+Dodum&display=swap">
<link rel="stylesheet" href="easel.css">
<style>
  /* 모둠별 예시: 견본(easel-sample.html)과 같은 종이·배치. 한 지역과 두 가지를 주고받으면 그 칸에 두 줄로 씁니다. */
  .groups { display: flex; flex-wrap: wrap; gap: 34px; align-items: flex-start; }
  .gx .node:not(.hub) { grid-template-rows: auto auto auto 1fr auto; }
  .gx .node:not(.hub) .swaps { grid-column: 1 / 3; display: grid; gap: 3px; justify-items: start; }
  .gx .node:not(.hub) .swap { font-size: 14px; }
  .gx .node:not(.hub) .swap i { font-size: 11.5px; }
  .gx .node:not(.hub) .pic { grid-column: 1; grid-row: 3; font-size: 13px; line-height: 1.25; padding: 4px; color: var(--mute); }
  .gx .node:not(.hub) .pic b { display: block; font-size: 14px; color: var(--teal); }
  /* ② 달라지는 것: 그림 옆에 여러 개 */
  .gx .ways { grid-column: 2; grid-row: 3; align-self: stretch; display: flex; flex-direction: column; justify-content: center; align-items: flex-start; gap: 3px; padding: 3px 4px; border: 2px dashed #7FB5BE; border-radius: 9px; background: #F3FBF9; }
  .gx .ways::before { content: "2"; display: inline-flex; align-items: center; justify-content: center; width: 19px; height: 19px; border-radius: 50%; background: var(--ink); color: #fff; font-family: 'Gowun Dodum', sans-serif; font-weight: 400; font-size: 12.5px; }
  .gx .ways span { font-size: 13.5px; line-height: 1.15; }
  /* 생활 모습: 두 가지면 두 줄 */
  .gx .lines { grid-column: 1 / 3; grid-row: 4; margin: 0; padding: 0; list-style: none; display: grid; gap: 3px; align-content: start; }
  .gx .lines li { position: relative; padding-left: 12px; font-size: 14.5px; line-height: 1.25; text-wrap: pretty; }
  .gx .lines li::before { content: "▸"; position: absolute; left: 0; color: var(--coral-d); }
  .gx .node:not(.hub) .plus { grid-row: 5; font-size: 13.5px; }
  .gx .hub .pic { font-size: 14px; color: #A9781A; padding: 6px; text-align: center; }
  .gx .chg li { font-size: 16px; }
  .gx .claim li { font-size: 15.5px; }
  .gx .papersize { text-align: left; }
  /* 촘촘하게: 주고받는 줄은 첫 줄에만 번호, ② 상자는 그림 높이 안에 */
  .gx .node:not(.hub) h3 { font-size: 18.5px; }
  .gx .node:not(.hub) .swap { padding: 0 6px; font-size: 13.5px; line-height: 1.3; }
  .gx .node:not(.hub) .swap + .swap::before { visibility: hidden; }
  .gx .ways { flex-direction: row; flex-wrap: wrap; align-content: center; justify-content: flex-start; gap: 2px 5px; padding: 3px 4px; max-height: 100%; overflow: hidden; }
  .gx .ways::before { width: 16px; height: 16px; font-size: 11px; flex-basis: 100%; max-width: 16px; margin-bottom: 1px; }
  .gx .ways span { font-size: 12.5px; line-height: 1.15; }
  .gx .lines li { font-size: 14px; }
  /* 두 가지를 주고받는 모둠도 종이 안에 들어가게 간격을 조금씩 좁힘 */
  .gx .pad .tl { gap: 9px; }
  .gx .pad .web { grid-template-rows: auto 9px auto; }
  .gx .pad .node:not(.hub) { row-gap: 3px; padding: 5px 6px; }
  .gx .node:not(.hub) h3 { line-height: 1.05; }
  .gx .node:not(.hub) .swap { line-height: 1.2; }
  .gx .node:not(.hub) .swaps { gap: 2px; }
  .gx .lines li { line-height: 1.2; }
  .gx .pad .claim { margin-top: 5px; }
  /* 달라진 우리 지역: 제목을 그림 옆 글 위로 올려 한 줄 아낌 */
  .gx .pad .hub { grid-template-rows: auto 1fr; row-gap: 3px; }
  .gx .pad .hub h3 { grid-column: 2; grid-row: 1; }
  .gx .pad .hub .pic { grid-column: 1; grid-row: 1 / 3; }
  .gx .pad .hub .chg { grid-column: 2; grid-row: 2; }
  .gx .pad .title b { font-size: 27px; }
  .gx .pad .keyq { font-size: 16px; padding: 3px 10px; }
  .gx .pad .trow .tk, .gx .pad .tc { min-height: 28px; font-size: 17px; }
  /* ② 상자: 한 줄에 하나씩, 낱말 중간에서 꺾이지 않게 */
  .gx .ways { flex-direction: column; flex-wrap: nowrap; align-items: flex-start; justify-content: center; gap: 1px; padding: 3px 2px 3px 4px; }
  .gx .ways::before { flex: none; flex-basis: auto; height: 16px; margin-bottom: 2px; }
  .gx .ways span { font-size: 12px; line-height: 1.15; word-break: keep-all; letter-spacing: -0.2px; }
  .gx .ways span::before { content: none; }
  .gx .ways span { white-space: nowrap; } /* 짧은 것은 한 줄로, 긴 것(이웃 지역과의 사이 등)만 줄바꿈 */
  .gx .ways span.long { white-space: normal; }
  /* 달라진 우리 지역: 이름표 칸을 넉넉히(가장 긴 '이웃 지역과의 사이'에 맞춤) */
  .gx .chg li { grid-template-columns: 130px 1fr; }
  .gnote { max-width: 980px; margin: 0 0 18px; font-size: 16px; line-height: 1.6; color: var(--mute); }
  /* 인쇄: 모둠마다 A3 세로 한 장 */
  html.pr .gx-sheet { box-sizing: border-box; width: 297mm; height: 419mm; padding: 9mm; overflow: hidden; break-after: page; break-inside: avoid; page: port; display: flex; align-items: center; justify-content: center; }
  html.pr .gx-sheet:last-child { break-after: auto; }
  html.pr .gx-sheet .fit { width: 720px; }
  html.pr .groups { display: block; }
  html.pr .gnote, html.pr h1 { display: none; }
  @media screen { html.pr.preview, html.pr.preview body { background: #888; } html.pr.preview .gx-sheet { background: #fff; margin: 12px auto; } }
</style>
</head>

<h1>모둠별 교류 제안서 예시</h1>

  // 받침이 있으면 앞의 말, 없으면 뒤의 말(은/는, 과/와)
  const jo = (w, a, b) => { const c = w.charCodeAt(w.length - 1); return c >= 0xAC00 && c <= 0xD7A3 && (c - 0xAC00) % 28 ? a : b; };
  const e = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const node = (n, cls, first) => `<div class="node ${cls}">
      <h3><span class="cn">3</span>달라진 ${e(n.name)}</h3>
      <div class="swaps">${n.swaps.map(([k, s]) => `<span class="swap"><i>${e(k)}</i>${e(s)}</span>`).join('')}</div>
      <div class="pic"><b>교류 후 그림</b>${e(n.pic)}</div>
      <div class="ways">${n.ways.map((w) => `<span${w.length > 6 ? ' class="long"' : ''}>${e(w)}</span>`).join('')}</div>
      <ul class="lines">${n.lines.map((l) => `<li>${e(l)}</li>`).join('')}</ul>
      <span class="plus">${e(n.plus)}</span>
    </div>`;
  const pad = (d) => `<div class="pad">
      <div class="title"><b><span class="cn">1</span>${e(d.place)} 교류 제안서</b><span class="who2"><b>${e(d.g)}</b>이름, 이름, 이름, 이름</span></div>
      <div class="keyq"><span>탐구 질문</span><p>${KQ}</p></div>
      <div class="tl">
        <div class="trow"><span class="cn">2</span><span class="tk past">과거</span><div class="tc">${e(d.past)}</div></div>
        <div class="trow"><span class="tk now">현재</span><div class="tc"><span class="many">많은 것: ${e(d.many)}</span><span class="few">부족한 것: ${e(d.few)}</span></div></div>
        <div class="fut"><span class="tk future">미래 <small>교류하면 이렇게 달라져요</small></span>
          <div class="web">
            ${node(d.nodes[0], 'a')}${node(d.nodes[1], 'c')}${node(d.nodes[2], 'b')}
            <div class="lk l"></div><div class="lk r"></div><div class="lk v"></div>
            <div class="node hub">
              <h3><span class="cn">4</span>달라진 ${e(d.short)}</h3>
              <div class="pic">교류 후 ${e(d.short)} 그림<small>AI와 함께 상상해서 그린 그림</small></div>
              <ul class="chg">${d.chg.map(([k, s]) => `<li><b>${e(k)}</b><span>${e(s)}</span></li>`).join('')}</ul>
            </div>
          </div>
        </div>
      </div>
      <div class="claim chainbox"><span class="ans">탐구 질문에 대한 우리 지역의 답</span><span class="cn">5</span>${e(d.short)}${jo(d.short, '은', '는')} <u>${e(d.claim.with)}</u>${jo(d.claim.with, '과', '와')} 교류해야 합니다. 왜냐하면
        <ol class="chain">
          <li><b>왜 부족할까요?</b><span><i class="why-sp">곳</i>${e(d.claim.sp)}<br><i class="why-tm">때</i>${e(d.claim.tm)}</span></li>
          <li><b>서로 채워요</b><span><em class="so">그래서</em>${e(d.claim.fill)}</span></li>
          <li><b>함께 만들어요</b><span><em class="so">그러면</em>${e(d.claim.make)}</span></li>
          <li><b>살아가는 방식이 달라져요</b><span><em class="so">그 결과</em>${e(d.claim.life)}</span></li>
        </ol></div>
    </div>`;
  document.getElementById('groups').innerHTML = GROUPS.map((d) => `<div class="gx-sheet gx"><div class="fit"><figure>
      <figcaption>${e(d.g)} · ${e(d.place)}</figcaption>${pad(d)}
      <div class="papersize">실제 종이: 가로 63.5cm × 세로 76.2cm · 세 지역 그림 A7 가로(10.5 × 7.4cm) · 우리 지역 그림 A6 가로(14.8 × 10.5cm)</div>
    </figure></div></div>`).join('');
</script>
<script>
  // 인쇄 직전에 틀을 켜고, 장마다 내용이 종이에 꼭 차도록 크기를 맞춥니다(easel-sample.html 과 같은 방식).
  (function () {
    const root = document.documentElement;
    function fit() {
      document.querySelectorAll('.gx-sheet').forEach((sh) => {
        const box = sh.querySelector('.fit');
        box.style.zoom = 1;
        const cs = getComputedStyle(sh);
        const W = sh.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
        const H = sh.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
        box.style.zoom = Math.min(W / box.offsetWidth, H / box.offsetHeight);
      });
    }
    function on() { root.classList.add('pr'); fit(); }
    function off() { if (!root.classList.contains('preview')) { root.classList.remove('pr'); document.querySelectorAll('.fit').forEach((b) => { b.style.zoom = ''; }); } }
    window.addEventListener('beforeprint', on);
    window.addEventListener('afterprint', off);
    document.getElementById('printBtn').addEventListener('click', () => { on(); window.print(); });
    if (/[?&]pr=1/.test(location.search)) {
      root.classList.add('preview');
      window.addEventListener('load', () => { (document.fonts ? document.fonts.ready : Promise.resolve()).then(on); });
    }
  })();
</script>
</body>
</html>
